<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sibernetic Runner</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; }
    h1 { margin-bottom: 0.2em; }
    .sub { color: #666; margin-top: 0; }
    label { display: block; margin: 1em 0 0.3em; font-weight: 600; }
    input, select { width: 100%; padding: 0.5em; font-size: 1em; box-sizing: border-box; }
    button { margin-top: 1.5em; padding: 0.8em 1.4em; font-size: 1em; background: #0070f3; color: white; border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #999; cursor: wait; }
    pre { background: #f5f5f5; padding: 1em; border-radius: 4px; overflow-x: auto; font-size: 0.85em; }
    .status { margin-top: 1.5em; padding: 1em; background: #f5f5f5; border-left: 4px solid #0070f3; }
  </style>
</head>
<body>
  <h1>Sibernetic Runner {{ version }}</h1>
  <p class="sub">Submit a Sibernetic (OpenCL) simulation job to the Cloud Run GPU service.</p>

  <form id="runForm">
    <label>Config (Sibernetic config name)</label>
    <select name="config" required>
      <option value="demo1" selected>demo1</option>
      <option value="demo2">demo2</option>
      <option value="worm">worm</option>
      <option value="worm_no_water">worm_no_water</option>
      <option value="worm_crawling">worm_crawling</option>
      <option value="worm_deep_water">worm_deep_water</option>
      <option value="worm_crawl_half_resolution">worm_crawl_half_resolution</option>
      <option value="worm_swim_half_resolution_immersed">worm_swim_half_resolution_immersed</option>
      <option value="worm_alone_half_resolution">worm_alone_half_resolution</option>
      <option value="worm_swim_half_resolution">worm_swim_half_resolution</option>
    </select>

    <label>LEMS file (network model driving the muscles)</label>
    <select name="lems">
      <option value="" selected>No LEMS, use c302 ref/params below</option>
      <option value="tests/NeuroML/exPGSR21_103_10s_nml_musc/LEMS_Worm2D.xml">tests/NeuroML/exPGSR21_103_10s_nml_musc/LEMS_Worm2D.xml</option>
      <option value="tests/NeuroML/exPGSR21_23_10s_nml_musc/LEMS_Worm2D.xml">tests/NeuroML/exPGSR21_23_10s_nml_musc/LEMS_Worm2D.xml</option>
    </select>

    <label>c302 reference (neuronal model driving the muscles; ignored if a LEMS file is chosen)</label>
    <select name="c302_ref" required>
      <option value="no_c302" selected>no_c302</option>
      <option value="FW">FW</option>
      <option value="TargetMuscle">TargetMuscle</option>
    </select>

    <label>c302 parameter set (ignored when c302 reference is no_c302 or a LEMS file is chosen)</label>
    <select name="c302params" required>
      <option value="C0">C0</option>
      <option value="C2" selected>C2</option>
      <option value="W2D">W2D</option>
    </select>

    <label>c302 data reader (ignored when a LEMS file is chosen)</label>
    <select name="datareader" required>
      <option value="UpdatedSpreadsheetDataReader2" selected>UpdatedSpreadsheetDataReader2</option>
      <option value="SpreadsheetDataReader">SpreadsheetDataReader</option>
    </select>

    <label>Time limit (sim duration in seconds)</label>
    <input name="timelimit" type="number" step="0.001" value="0.05" required>

    <label>Time step dt (ms; Sibernetic's default is 0.005)</label>
    <input name="dt" type="number" step="any" min="0.0001" value="0.005" required>

    <label>Log step</label>
    <input name="logstep" type="number" min="1" value="10" required>

    <label>Sibernetic ref (optional — branch, tag, or SHA to build at request time)</label>
    <input name="sibernetic_ref" placeholder="leave blank to use baked binary; e.g. a branch name or 61d8fd4">

    <label style="display: flex; align-items: center; gap: 0.5em; font-weight: 600;">
      <input name="render" type="checkbox" style="width: auto;">
      Render MP4 of the simulation (adds ~10-60s)
    </label>

    <button type="submit" id="submitBtn">Submit job</button>
  </form>

  <div id="status" class="status" style="display:none">
    <strong>Status:</strong> <span id="statusText"></span><br>
    <small>Job ID: <code id="jobId"></code></small>
    <pre id="result" style="display:none"></pre>
  </div>

  <script>
  document.getElementById("runForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = {
      config: f.config.value,
      c302_ref: f.c302_ref.value,
      c302params: f.c302params.value,
      datareader: f.datareader.value,
      timelimit: parseFloat(f.timelimit.value),
      dt: parseFloat(f.dt.value),
      logstep: parseInt(f.logstep.value, 10),
    };
    const ref = f.sibernetic_ref.value.trim();
    if (ref) body.sibernetic_ref = ref;
    if (f.lems.value) body.lems = f.lems.value;
    if (f.render.checked) body.render = true;
    const btn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const jobIdEl = document.getElementById("jobId");
    const resultEl = document.getElementById("result");

    btn.disabled = true;
    statusBox.style.display = "block";
    statusText.textContent = "submitting...";
    resultEl.style.display = "none";
    const oldPlayer = document.getElementById("renderPlayer");
    if (oldPlayer) oldPlayer.remove();

    try {
      const resp = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error(`submit failed: ${resp.status} ${await resp.text()}`);
      const { job_id } = await resp.json();
      jobIdEl.textContent = job_id;

      // Poll status every 5 sec.
      while (true) {
        await new Promise(r => setTimeout(r, 5000));
        const sResp = await fetch(`/api/status/${job_id}`);
        const s = await sResp.json();
        statusText.textContent = s.status;
        if (s.status === "succeeded" || s.status === "failed") {
          const rResp = await fetch(`/api/result/${job_id}`);
          const r = await rResp.json();
          resultEl.textContent = JSON.stringify(r, null, 2);
          resultEl.style.display = "block";
          // If a render was produced, show a player + download link.
          if (r.render_local_path || (r.buffer_urls && r.buffer_urls.render)) {
            const renderUrl = `/api/render/${job_id}`;
            const player = document.createElement("div");
            player.id = "renderPlayer";
            player.style.marginTop = "1em";
            player.innerHTML = `
              <strong>Render:</strong>
              <video src="${renderUrl}" controls style="display:block; max-width: 100%; margin-top: 0.5em;"></video>
              <a href="${renderUrl}" download="sibernetic-${job_id}.mp4">Download MP4</a>
            `;
            statusBox.appendChild(player);
          }
          break;
        }
      }
    } catch (err) {
      statusText.textContent = `error: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  });
  </script>
</body>
</html>
